<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Sản phẩm (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2 class="mb-4">Trang Quản lý Sản phẩm</h2>
  <div class="alert alert-info mt-3" id="tokenDisplay"></div>
  <!-- Form thêm/sửa sản phẩm -->
  <form id="productForm">
    <input type="hidden" id="productId">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="name" class="form-label">Tên sản phẩm</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="col-md-6">
        <label for="productType" class="form-label">Loại sản phẩm</label>
        <input type="text" class="form-control" id="productType" required>
      </div>
      <div class="col-md-6">
        <label for="price" class="form-label">Giá</label>
        <input type="number" class="form-control" id="price" required>
      </div>
      <div class="col-md-6">
        <label for="stockQuantity" class="form-label">Số lượng</label>
        <input type="number" class="form-control" id="stockQuantity" required>
      </div>
      <div class="col-md-6">
        <label for="manufactureDate" class="form-label">Ngày sản xuất</label>
        <input type="date" class="form-control" id="manufactureDate" required>
      </div>
      <div class="col-md-6">
        <label for="expiryDate" class="form-label">Hạn sử dụng</label>
        <input type="date" class="form-control" id="expiryDate" required>
      </div>
      <div class="col-md-12">
        <label for="imageUrl" class="form-label">Hình ảnh (URL)</label>
        <input type="text" class="form-control" id="imageUrl">
      </div>
      <div class="col-md-12">
        <label for="description" class="form-label">Mô tả</label>
        <textarea class="form-control" id="description"></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
      <button type="button" class="btn btn-secondary" onclick="resetForm()">Hủy</button>
    </div>
  </form>

  <hr class="my-4">

  <!-- Bảng danh sách sản phẩm -->
  <h4>Danh sách sản phẩm</h4>
  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Giá</th>
        <th>Loại</th>
        <th>Số lượng</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="productTableBody"></tbody>
  </table>
</div>

<script>
const API_URL = "http://14.225.220.60:8090/api/product";
const token = localStorage.getItem('token');
console.log("Token hiện tại:", token);
document.getElementById("tokenDisplay").innerText = token ? `Token: ${token}` : "Token không tồn tại!";
document.getElementById("tokenDisplay").style.color = token ? "green" : "red";
function loadProducts() {
  fetch(API_URL)
    .then(res => res.json())
    .then(products => {
      const tbody = document.getElementById("productTableBody");
      tbody.innerHTML = "";
      products.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>${p.price}đ</td>
          <td>${p.productType}</td>
          <td>${p.stockQuantity}</td>
          <td>
            <button class="btn btn-warning btn-sm" onclick='editProduct(${JSON.stringify(p)})'>Sửa</button>
            <button class="btn btn-danger btn-sm" onclick='deleteProduct(${p.id})'>Xóa</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
}

function resetForm() {
  document.getElementById("productForm").reset();
  document.getElementById("productId").value = "";
}

function editProduct(p) {
  document.getElementById("productId").value = p.id;
  document.getElementById("name").value = p.name;
  document.getElementById("price").value = p.price;
  document.getElementById("productType").value = p.productType;
  document.getElementById("stockQuantity").value = p.stockQuantity;
  document.getElementById("manufactureDate").value = p.manufactureDate;
  document.getElementById("expiryDate").value = p.expiryDate;
  document.getElementById("imageUrl").value = p.imageUrl;
  document.getElementById("description").value = p.description;
}

function deleteProduct(id) {
  if (!confirm("Bạn có chắc muốn xóa sản phẩm này?")) return;
  fetch(`${API_URL}/${id}`, {
    method: 'DELETE',
    headers: {
      'Authorization': 'Bearer ' + token
    }
  })
  .then(res => res.ok ? loadProducts() : alert("Xóa thất bại"));
}

// Submit form
document.getElementById("productForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const product = {
    id: document.getElementById("productId").value || 0,
    name: document.getElementById("name").value,
    description: document.getElementById("description").value,
    price: parseFloat(document.getElementById("price").value),
    productType: document.getElementById("productType").value,
    manufactureDate: document.getElementById("manufactureDate").value,
    expiryDate: document.getElementById("expiryDate").value,
    stockQuantity: parseInt(document.getElementById("stockQuantity").value),
    imageUrl: document.getElementById("imageUrl").value
  };

  fetch(API_URL, {
    method: product.id != 0 ? 'PUT' : 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify(product)
  })
  .then(res => res.ok ? loadProducts() : alert("Thêm/Sửa thất bại"))
  .then(() => resetForm());
});

// Load dữ liệu khi trang sẵn sàng
window.addEventListener("DOMContentLoaded", loadProducts);
</script>

</body>
</html>
