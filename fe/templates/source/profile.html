<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .profile-container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .profile-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-header img {
      border-radius: 50%;
      width: 100px;
      height: 100px;
      margin-right: 20px;
    }

    .profile-header h1 {
      margin: 0;
    }

    .profile-details {
      margin-top: 20px;
    }

    .profile-details p {
      margin: 10px 0;
    }

    .profile-links a {
      color: #0366d6;
      text-decoration: none;
      margin-right: 15px;
    }

    .profile-links a:hover {
      text-decoration: underline;
    }

    .logout-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #d9534f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .logout-button:hover {
      background-color: #c9302c;
    }
  </style>
</head>
<body>

  <div class="profile-container">
    <div class="profile-header">
      <img src="https://avatars.githubusercontent.com/u/583231?v=4" alt="Profile Picture"> <!-- Đặt ảnh người dùng -->
      <div>
        <h1>Hi, <span id="username">User Name</span></h1> <!-- Tên người dùng -->
        <p id="user-bio">Short bio or description about the user...</p> <!-- Mô tả người dùng -->
      </div>
    </div>

    <div class="profile-details">
      <h2>Contact Information</h2>
      <p>Email: <span id="email">user@example.com</span></p> <!-- Email của người dùng -->
    </div>

    <div class="profile-links">
      <h2>Links</h2>
      <a href="https://github.com/[username]" target="_blank">GitHub</a> <!-- Thay [username] bằng tên GitHub -->
      <a href="https://twitter.com/[username]" target="_blank">Twitter</a> <!-- Thay [username] bằng tên Twitter -->
    </div>

    <button class="logout-button" onclick="logout()">Logout</button> <!-- Nút đăng xuất -->
  </div>

  <script>
    // Giả lập thông tin người dùng từ localStorage
    const username = localStorage.getItem('username') || 'User Name';
    const email = localStorage.getItem('email') || 'user@example.com';
    const bio = localStorage.getItem('bio') || 'Short bio or description about the user...';

    // Cập nhật thông tin vào trang
    document.getElementById('username').innerText = username;
    document.getElementById('email').innerText = email;
    document.getElementById('user-bio').innerText = bio;

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      localStorage.removeItem('email');
      localStorage.removeItem('bio');
      window.location.href = 'login_register.html'; // Redirect về trang đăng nhập
    }
  </script>

</body>
</html>
