name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'be/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'be/**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -f be/se-cnpm-beelifeventures/pom.xml test
