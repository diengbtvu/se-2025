name: Docker Compose CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Move to docker-compose directory
      run: cd se-2025/be/se-cnpm-beelifeventures

    - name: Build docker-compose services
      working-directory: se-2025/be/se-cnpm-beelifeventures
      run: docker-compose build

    - name: Run containers for testing
      working-directory: se-2025/be/se-cnpm-beelifeventures
      run: docker-compose up -d

    - name: Show running containers
      run: docker ps -a

    # (Optional) Add test step here if you have automated tests

    - name: Stop containers
      working-directory: se-2025/be/se-cnpm-beelifeventures
      run: docker-compose down
