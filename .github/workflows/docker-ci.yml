name: CI Build & Test

on:
  push:
    branches: [ "main", "develop", "se-docker" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Test Frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: fe/package-lock.json

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run linting
      run: npm run lint
      continue-on-error: true

    - name: Run tests
      run: npm test -- --watchAll=false --passWithNoTests
      continue-on-error: true

    - name: Build frontend
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://backend:8080

  # Test Backend
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be/se-cnpm-beelifeventures

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: mvn clean test
      continue-on-error: true

    - name: Build backend
      run: mvn clean package -DskipTests

  # Docker Build Test
  docker-test:
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test Docker build
      run: |
        echo "Testing Docker builds..."
        docker build -t test-frontend ./fe
        docker build -t test-backend ./be/se-cnpm-beelifeventures
        echo "✅ Docker builds successful!"

    - name: Test docker-compose
      run: |
        echo "Testing docker-compose..."
        docker-compose config
        echo "✅ Docker compose config valid!"

  # Deploy to VPS
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Di chuyển đến thư mục project
          cd ~/se-2025 || mkdir -p ~/se-2025 && cd ~/se-2025
          
          # Pull code mới nhất
          git pull origin main || git clone https://github.com/${{ github.repository }}.git . && git checkout main
          
          # Stop containers cũ
          docker-compose down
          
          # Build và start containers mới
          docker-compose up -d --build
          
          # Kiểm tra services
          docker-compose ps
          
          echo "✅ Deploy completed!" 