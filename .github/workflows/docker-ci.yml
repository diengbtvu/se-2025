name: BeeLifeVentures CI/CD

on:
  push:
    branches: [ "main", "develop", "se-docker" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test và Build Frontend
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: fe/package-lock.json

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run linting
      run: npm run lint || true

    - name: Run tests
      run: npm test -- --coverage --watchAll=false --passWithNoTests
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: |
          fe/coverage/
          fe/jest-results.xml

    - name: Build frontend
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://backend:8080

    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: success()
      with:
        file: ./fe/coverage/lcov.info
        flags: frontend

  # Test và Build Backend
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be/se-cnpm-beelifeventures

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: mvn clean test
      continue-on-error: true

    - name: Generate test report
      run: mvn surefire-report:report
      continue-on-error: true

    - name: Build backend
      run: mvn clean package -DskipTests

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: be/se-cnpm-beelifeventures/target/surefire-reports/

  # Build Docker Images
  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    strategy:
      matrix:
        service: [frontend, backend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request' && github.repository_owner == github.actor
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service == 'frontend' && './fe' || './be/se-cnpm-beelifeventures' }}
        file: ${{ matrix.service == 'frontend' && './fe/Dockerfile' || './be/se-cnpm-beelifeventures/Dockerfile' }}
        push: false  # Disable push to avoid permission errors
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ${{ matrix.service == 'frontend' && 'NEXT_PUBLIC_API_URL=http://backend:8080' || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Integration Test với Docker Compose
  integration-test:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        echo "NEXT_PUBLIC_API_URL=http://backend:8080" > .env

    - name: Start services
      run: |
        docker-compose up -d --build
        sleep 30

    - name: Wait for services to be ready
      run: |
        # Wait for backend
        timeout 60 bash -c 'until curl -f http://localhost:8080/api/product; do sleep 2; done'
        
        # Wait for frontend
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

    - name: Run integration tests
      run: |
        # Test backend API
        curl -f http://localhost:8080/api/product
        
        # Test frontend
        curl -f http://localhost:3000

    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== Backend Logs ==="
        docker-compose logs backend
        echo "=== Frontend Logs ==="
        docker-compose logs frontend

    - name: Clean up
      if: always()
      run: docker-compose down -v

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        service: [frontend, backend]

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results-${{ matrix.service }}.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  # Deploy to Staging (Optional)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: SSH to staging server and run docker-compose
        
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests on staging..."
        # Add smoke tests for staging environment

  # Deploy to Production (Manual)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # Add your production deployment commands here
        
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests on production..."
        # Add smoke tests for production environment

    - name: Notify team
      if: success()
      run: |
        echo "✅ Production deployment successful!"
        # Add notification to Slack/Discord/Email

  # Cleanup old images
  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-production]

    steps:
    - name: Delete old package versions
      uses: actions/delete-package-versions@v4
      with:
        package-name: ${{ github.event.repository.name }}-frontend
        package-type: container
        min-versions-to-keep: 5
        delete-only-untagged-versions: true

    - name: Delete old package versions
      uses: actions/delete-package-versions@v4
      with:
        package-name: ${{ github.event.repository.name }}-backend
        package-type: container
        min-versions-to-keep: 5
        delete-only-untagged-versions: true 