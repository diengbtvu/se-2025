services:
  # Backend Service
  backend:
    build:
      context: ./be/se-cnpm-beelifeventures
      dockerfile: Dockerfile
    container_name: beelife-backend
    mem_limit: 2g
    ports:
      - "8082:8082"
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://14.225.220.60:3306/beelifeventures?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=beelife_user
      - SPRING_DATASOURCE_PASSWORD=dfjsdbA3f@a!@#sdb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/product"]
      interval: 30s
      timeout: 50s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ./be/se-cnpm-beelifeventures/tokens:/tokens
    networks:
      - beelife-network

  # Frontend Service
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8082
    container_name: beelife-frontend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=8000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Increased for better reliability
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy  # Wait for backend health check
    networks:
      - beelife-network

  # Frontend Development Service (Optional)
  frontend-dev:
    build:
      context: ./fe
      dockerfile: Dockerfile.dev
    container_name: beelife-frontend-dev
    ports:
      - "3001:8000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=8000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8082
    volumes:
      - ./fe:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - beelife-network
    profiles:
      - dev

networks:
  beelife-network:
    driver: bridge